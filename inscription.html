<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription - Group Fight Academy</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #050505;
      color: white;
      min-height: 100vh;
      padding: 30px 15px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: #090a0d;
      border: 1px solid #202633;
      border-radius: 20px;
      padding: 30px;
    }

    .logo {
      width: 70px;
      height: 70px;
      border-radius: 18px;
      background: #d90016;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #9ca3af;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #303744;
      background: #050505;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 30px;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #e00018;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      margin-top: 20px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>
Téléphone urgence
<div class="container">

  <div class="logo">GFA</div>

  <h1>Inscription GFA</h1>
  <div class="subtitle">
    Group Fight Academy • Saison 2026 / 2027
  </div>

  <form id="registrationForm">

    <label>Nom *</label>
    <input name="lastName" required>

    <label>Prénom *</label>
    <input name="firstName" required>

    <label>Date de naissance *</label>
    <input type="date" name="birthDate" required>

    <label>Section *</label>
    <select name="section" required>
      <option value="">Choisir une section</option>
      <option value="Adultes">Adultes</option>
      <option value="Kids / Ados">Kids / Ados</option>
      <option value="100% Women">100% Women</option>
    </select>
<div id="reglementBloc" style="display:none; margin-top:20px; padding:18px; border:1px solid #2a2a2a; border-radius:12px;">

  <h3>Règlement intérieur</h3>

  <p>
    <a id="reglementLien" href="#" target="_blank" style="color:#ff3b30; font-weight:bold;">
      Consulter le règlement intérieur
    </a>
  </p>

  <label style="display:flex; gap:10px; align-items:flex-start;">
    <input type="checkbox" id="reglementAccepte">
    <span>J’ai lu et j’accepte le règlement intérieur.</span>
  </label>

  <label>Mention obligatoire *</label>
  <input
    type="text"
    id="mentionReglement"
    placeholder="Écrire : Lu et approuvé"
  >

  <label>Signature *</label>
  <input
    type="text"
    id="signatureReglement"
    placeholder="Nom et prénom"
  >

</div>
    <label>Téléphone *</label>
    <input type="tel" name="phone" required>

    <label>Email *</label>
    <input type="email" name="email" required>

    <label>Adresse complète *</label>
    <input name="address" required>

    <label>Personne à prévenir en cas d'urgence *</label>
    <input name="emergency" required>

    <label>Téléphone d'urgence *</label>
    <input type="tel" name="emergencyPhone" required>

  <label style="display:flex; align-items:center; gap:10px;">
  <input type="checkbox" name="medicalCertificateToProvide" value="oui" style="width:auto; margin:0;">
  Je fournirai mon certificat médical au club
</label>

    <button type="submit">
      Envoyer mon inscription
    </button>

    <div id="message"></div>

  </form>

</div>

  
  

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDWJXqKNdnbnYnvQesx5nv2oaxjyEPnFyk",
  authDomain: "gfa-chek-in.firebaseapp.com",
  projectId: "gfa-chek-in",
  storageBucket: "gfa-chek-in.firebasestorage.app",
  messagingSenderId: "17301115107",
  appId: "1:17301115107:web:cf1757811f2c88aa5b35d6"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const form = document.getElementById("registrationForm");
const message = document.getElementById("message");

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const button = form.querySelector('button[type="submit"]');
  button.disabled = true;
  button.textContent = "Envoi en cours...";

  try {
    const data = Object.fromEntries(new FormData(form).entries());
delete data.medicalCertificate;
    await addDoc(collection(db, "registrations"), {
      ...data,
      status: "pending",
      createdAt: serverTimestamp()
    });

    message.textContent = "✅ Votre inscription a bien été envoyée.";
    form.reset();

  } catch (error) {
    console.error(error);
    message.textContent = "❌ Impossible d'envoyer l'inscription. Réessayez.";
  } finally {
    button.disabled = false;
    button.textContent = "Envoyer mon inscription";
  }
});
</script><script>
  const sectionSelect = document.querySelector('select[name="section"]');
  const reglementBloc = document.getElementById('reglementBloc');
  const reglementLien = document.getElementById('reglementLien');
const reglementAccepte = document.getElementById('reglementAccepte');
const mentionReglement = document.getElementById('mentionReglement');
const signatureReglement = document.getElementById('signatureReglement');
  sectionSelect.addEventListener('change', function () {
    const section = this.value;

    if (section === 'Adultes' || section === '100% Women') {
      reglementBloc.style.display = 'block';
      reglementAccepte.required = true;
mentionReglement.required = true;
signatureReglement.required = true;

      if (section === 'Adultes') {
        reglementLien.href = 'RÈGLEMENT INTÉRIEUR ADULTES GROUP FIGHT ACADEMY..pdf';
      }

      if (section === '100% Women') {
        reglementLien.href = '#';
      }

    } else {
      reglementBloc.style.display = 'none';
      reglementAccepte.required = false;
mentionReglement.required = false;
signatureReglement.required = false;
    mentionReglement.setCustomValidity('');
}
  });
  mentionReglement.addEventListener('input', function () {
  const texte = this.value.trim().toLowerCase();

  if (texte === 'lu et approuvé' || texte === 'lu et approuve') {
    this.setCustomValidity('');
  } else {
    this.setCustomValidity('Veuillez écrire : Lu et approuvé');
  }
});
</script>
</body>
</html>
